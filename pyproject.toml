[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[project]
name = "rgb_vs_skeleton"
version = "0.0.1"
description = "Human action recognition is an important computer vision problem with applications in areas such as robotics, surveillance and assistive systems."
authors = [
  { name = "Zivota Milinkovic, SID: 21430557", email = "your@email.com" },
]

keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "hydra-core>=1.3.8",
    "imageio-ffmpeg>=0.8.1",
    "opencv-python>=5.0.0.93",
    "psutil>=7.2.2",
    "pytorchvideo>=0.1.5",
    "torch==2.6.0",
    "torchvision>=0.21.0",
    "typer==0.15.1",
    "ultralytics>=8.4.212",
    "uvicorn==0.34.0",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "coverage==7.6.9",
    "invoke==2.2.0",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "ruff==0.1.3",
    "mypy==1.19.1",
    "mkdocs-material==9.7.1",
    "mkdocstrings-python==2.0.1",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
torchvision = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = ["tests/*"]
